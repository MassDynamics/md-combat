steps:
  ################################################################################
  ## Lint & test
  ################################################################################
  - label: ":lint-roller: lint"
    key: lint
    command: scripts/lint
    env:
      CI: "true"
    agents:
      python: true

  - label: ":python: test"
    key: test
    if: build.message !~ /[@]fast/
    command: scripts/test
    env:
      CI: "true"
    agents:
      python: true

  - wait: ~
    key: pre_tag

  ################################################################################
  ## Tag
  ################################################################################
  - label: ":github: tag"
    key: tag_package
    env:
      BUILD_NUMBER: "${BUILDKITE_BUILD_NUMBER}"
      GIT_HASH: "${BUILDKITE_COMMIT}"
    command: scripts/tag
    agents:
      ebdeploy: true
    concurrency: 1
    concurrency_group: "md-combat/tag"
